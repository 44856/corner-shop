name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 缓存引擎
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-linux

      - name: 安装 Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1 libfreetype6

      - name: 缓存导入结果
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-4.7.2-${{ hashFiles('assets/**', 'shaders/**', 'audio/**', 'project.godot') }}
          restore-keys: godot-import-4.7.2-

      - name: 版本自检
        run: ~/godot/godot --version

      # 静态规则先跑：几秒出结果，坏了就不必等 20 秒的 probe。
      - name: 规则检查
        run: ./tools/lint_rules.sh

      - name: 回归测试
        run: ./tools/check.sh
